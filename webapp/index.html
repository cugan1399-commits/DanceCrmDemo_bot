<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Встреча — демо Bitrix24</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .day { margin-bottom: 16px; }
  .day-label { font-weight: 600; margin-bottom: 6px; text-transform: capitalize; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--tg-theme-hint-color, #ccc); cursor: pointer; font-size: 14px; }
  .slot.selected { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .empty { opacity: .5; font-size: 13px; }
  form { display: none; margin-top: 20px; flex-direction: column; gap: 10px; }
  form.visible { display: flex; }
  select, input, button { padding: 10px; border-radius: 10px; border: 1px solid var(--tg-theme-hint-color, #ccc); font-size: 14px; }
  button { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; font-weight: 600; }
  #status { margin-top: 12px; font-size: 14px; }
  .more-dates { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--tg-theme-hint-color, #ccc); }
  .more-dates-label { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
  .more-dates-row { display: flex; gap: 8px; }
  .more-dates-row input[type="date"] { flex: 1; }
  .more-dates-row button { white-space: nowrap; }
</style>
</head>
<body>
  <h1>Свободное время (из Битрикс24)</h1>
  <div id="days">Загрузка…</div>

  <div class="more-dates">
    <div class="more-dates-label">Или выберите другую дату</div>
    <div class="more-dates-row">
      <input type="date" id="datePicker">
      <button type="button" id="datePickerGo">Показать</button>
    </div>
  </div>

  <form id="bookingForm">
    <div id="chosenSlot" style="font-size:14px;opacity:.7;"></div>
    <input id="topic" placeholder="Тема встречи" required>
    <input id="name" placeholder="Имя" required>
    <input id="phone" placeholder="Телефон" required>
    <button type="submit">Записаться на встречу</button>
  </form>

  <div id="status"></div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  const initData = tg?.initData || '';

  let chosen = null;

  function renderDays(days, container) {
    container.innerHTML = '';
    for (const day of days) {
      const div = document.createElement('div');
      div.className = 'day';
      const slotsHtml = day.slots.length
        ? day.slots.map(s => `<div class="slot" data-date="${day.dateStr}" data-time="${s}">${s}</div>`).join('')
        : '<div class="empty">нет свободных окон</div>';
      div.innerHTML = `<div class="day-label">${day.weekday}, ${day.dateStr}</div><div class="slots">${slotsHtml}</div>`;
      container.appendChild(div);
    }

    container.querySelectorAll('.slot').forEach(el => {
      el.addEventListener('click', () => {
        container.querySelectorAll('.slot.selected').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        chosen = { dateStr: el.dataset.date, time: el.dataset.time };
        document.getElementById('chosenSlot').textContent = `Выбрано: ${chosen.dateStr} в ${chosen.time}`;
        document.getElementById('bookingForm').classList.add('visible');
      });
    });
  }

  // Ближайшие дни идут "лентой" от сегодня (см. /api/slots на сервере) — никакой
  // привязки к пн-вс и никаких пустых прошедших дней.
  async function loadSlots() {
    const res = await fetch('/api/slots?initData=' + encodeURIComponent(initData));
    if (!res.ok) { document.getElementById('days').textContent = 'Не удалось загрузить расписание из Битрикса.'; return; }
    const data = await res.json();
    renderDays(data.days, document.getElementById('days'));

    // Ограничиваем дата-пикер тем диапазоном, который реально можно забронировать.
    const picker = document.getElementById('datePicker');
    if (data.minDate) picker.min = data.minDate;
    if (data.maxDate) picker.max = data.maxDate;
  }

  // Даты за пределами ближайшей ленты — по кнопке "Показать" одним запросом
  // на конкретный день.
  document.getElementById('datePickerGo').addEventListener('click', async () => {
    const status = document.getElementById('status');
    const picker = document.getElementById('datePicker');
    if (!picker.value) return;

    status.textContent = 'Загружаем...';
    const res = await fetch('/api/slots?initData=' + encodeURIComponent(initData) + '&date=' + encodeURIComponent(picker.value));
    if (!res.ok) { status.textContent = 'Не удалось загрузить эту дату.'; return; }
    const data = await res.json();
    status.textContent = '';
    renderDays(data.days, document.getElementById('days'));
  });

  document.getElementById('bookingForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!chosen) return;
    const status = document.getElementById('status');
    status.textContent = 'Отправляем заявку…';

    const res = await fetch('/api/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        initData,
        dateStr: chosen.dateStr,
        time: chosen.time,
        topic: document.getElementById('topic').value,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
      }),
    });

    if (res.status === 409) { status.textContent = 'Увы, этот слот уже заняли — выберите другой.'; return; }
    if (!res.ok) { status.textContent = 'Ошибка. Попробуйте позже.'; return; }

    status.textContent = '✅ Заявка отправлена! Ждите подтверждения в этом чате.';
    document.getElementById('bookingForm').classList.remove('visible');
    loadSlots();
  });

  loadSlots();
</script>
</body>
</html>
